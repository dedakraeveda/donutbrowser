name: macOS ARM64 native engine baseline
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos155-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect disk budget and native architecture
        run: |
          uname -m
          df -h "$RUNNER_TEMP" /tmp
      - name: Download and verify pinned original app
        run: python3 distribution/macos155/prepare_probe.py
      - name: Install only the protocol client, no browser download
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/donut-arm-native-probe" --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/donut-arm-native-probe/npm-cache"
      - name: Real ARM64 CDP form and native capability baseline
        run: node distribution/macos155/probe.mjs "$RUNNER_TEMP/donut-arm-native-probe"
      - name: Final disk measurement
        if: always()
        run: df -h "$RUNNER_TEMP" /tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-official-wayfern-baseline
          path: |
            ${{ runner.temp }}/donut-arm-native-probe/INPUT.json
            ${{ runner.temp }}/donut-arm-native-probe/BASELINE.json
            ${{ runner.temp }}/donut-arm-native-probe/engine-baseline.log
          if-no-files-found: error
          retention-days: 14
