name: Donut Agent Kit Windows (manual native manager)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-kit-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Select native MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build isolated manager (no engine substitution)
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: python distribution\build_windows.py --work "%RUNNER_TEMP%\donut-kit-windows-work" --output "%RUNNER_TEMP%\donut-kit-windows-output"
      - name: Keep failed-stage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Donut-windows-build-diagnostics
          path: ${{ runner.temp }}/donut-kit-windows-work/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload manager-only build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Donut-Agent-Kit-windows-x64-app-only
          path: ${{ runner.temp }}/donut-kit-windows-output/*
          if-no-files-found: error
          retention-days: 7
